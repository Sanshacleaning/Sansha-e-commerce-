<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sansha Private Limited</title><style>
*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#f4f7f5;color:#17231d}header,footer{background:#123c30;color:white;text-align:center;padding:22px}header h1{letter-spacing:4px;margin:0}.wrap{max-width:1050px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card,.panel{background:white;padding:16px;border-radius:12px;box-shadow:0 2px 10px #0001}.card img,.ph{width:100%;height:150px;object-fit:contain;background:#f6f7f6;border-radius:8px}.ph{display:grid;place-items:center;font-size:50px}.price{color:#13734f;font-weight:bold;font-size:21px}input,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccd5cf;border-radius:7px}button{background:#13734f;color:white;border:0;padding:12px;border-radius:7px;cursor:pointer}.row{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #eee;gap:10px}.muted{font-size:13px;color:#667}
</style><header><h1>SANSHA</h1><p>PRIVATE LIMITED · CLEANING & CAR CARE PRODUCTS</p></header><main class="wrap"><h2>Shop Products</h2><input id="search" placeholder="Search products..." oninput="render()"><div id="products" class="grid">Loading…</div><section class="panel"><h2>Your Cart</h2><div id="cart">Your cart is empty.</div><h3 id="total">Total: ₹0.00</h3><h3>Delivery Details (Cash on Delivery)</h3><form id="checkout">Full name<input id="cust" required>Mobile number<input id="phone" required type="tel">Delivery address<textarea id="address" required></textarea><button>Place Order</button></form><p id="msg" class="muted"></p></section></main><footer>Sansha Private Limited · Bongaigaon, Assam<br>sansha484@gmail.com · 6001864754<br><a style="color:white" href="/admin.html">Admin Login</a></footer>
<script>
let ps=[],cart=[];const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){try{ps=await(await fetch("/api/products")).json();render()}catch(e){products.textContent="Store unavailable"}}
function render(){let q=search.value.toLowerCase();products.innerHTML=ps.filter(p=>(p.name+" "+p.category).toLowerCase().includes(q)).map(p=>`<article class="card">${p.image_url?`<img src="${esc(p.image_url)}">`:'<div class="ph">🧴</div>'}<h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><p>${esc(p.size)}</p><p class="price">₹${Number(p.price).toFixed(2)}</p><p class="muted">Stock: ${p.stock}</p><button ${p.stock<1?"disabled":""} onclick="add(${p.id})">Add to Cart</button></article>`).join("")||"No products listed yet.";draw()}
function add(id){let p=ps.find(x=>x.id===id),c=cart.find(x=>x.id===id);if(c)c.qty++;else cart.push({...p,qty:1});draw()}
function qty(id,d){let c=cart.find(x=>x.id===id);c.qty+=d;cart=cart.filter(x=>x.qty>0);draw()}
function draw(){cartBox.innerHTML=cart.length?cart.map(p=>`<div class="row">${esc(p.name)} × ${p.qty}<span>₹${(p.price*p.qty).toFixed(2)} <button type="button" onclick="qty(${p.id},-1)">−</button> <button type="button" onclick="qty(${p.id},1)">+</button></span></div>`).join(""):"Your cart is empty.";total.textContent="Total: ₹"+cart.reduce((s,p)=>s+p.price*p.qty,0).toFixed(2)}
const cartBox=document.getElementById("cart"),total=document.getElementById("total");
checkout.onsubmit=async e=>{e.preventDefault();if(!cart.length)return alert("Add products first");let b=e.target.querySelector("button");b.disabled=true;try{let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:cust.value,phone:phone.value,address:address.value,items:cart.map(p=>({id:p.id,qty:p.qty}))})}),d=await r.json();if(!r.ok)throw Error(d.error);msg.textContent="Order #"+d.orderId+" saved. Opening WhatsApp…";cart=[];draw();location.href=d.whatsappUrl;load()}catch(x){alert(x.message)}finally{b.disabled=false}};load();
</script></html>
