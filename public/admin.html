<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sansha Admin</title><style>body{font:15px Arial;background:#f3f6f4;margin:0;color:#17231d}header{background:#123c30;color:white;padding:18px}.wrap{max-width:950px;margin:auto;padding:16px}section{background:white;padding:16px;border-radius:10px;margin:14px 0}input,textarea,select{width:100%;padding:11px;margin:5px 0 12px;border:1px solid #ccc;border-radius:7px}button{background:#13734f;color:white;border:0;padding:10px;border-radius:7px;margin:4px}.item{border-bottom:1px solid #ddd;padding:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}</style><header><b>SANSHA ADMIN</b> <a style="color:white;float:right" href="/">Store</a></header><main class="wrap"><section id="login"><h2>Admin Login</h2><form id="loginForm">Username<input id="username" value="admin" required>Password<input id="password" type="password" required><button>Login</button></form></section><div id="dash" hidden><section><button onclick="logout()">Logout</button><h2>Add Product</h2><form id="form"><div class="grid">Product name<input id="name" required>Category<input id="category">Price ₹<input id="price" type="number" min="0" step=".01" required>Pack size<input id="size">Stock<input id="stock" type="number" min="0" value="0">Image HTTPS URL<input id="image_url" type="url"></div>Description<textarea id="description"></textarea><button>Save Product</button></form></section><section><h2>Products</h2><div id="plist"></div></section><section><h2>Orders</h2><div id="olist"></div></section></div></main><script>
const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opt={}){let r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt}),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function boot(){try{await api("/api/admin/me");login.hidden=true;dash.hidden=false;refresh()}catch(e){}}
loginForm.onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({username:username.value,password:password.value})});login.hidden=true;dash.hidden=false;refresh()}catch(x){alert(x.message)}};
form.onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/products",{method:"POST",body:JSON.stringify({name:name.value,category:category.value,price:price.value,size:size.value,stock:stock.value,image_url:image_url.value,description:description.value})});e.target.reset();refresh();alert("Product added")}catch(x){alert(x.message)}};
async function refresh(){let [p,o]=await Promise.all([api("/api/products"),api("/api/admin/orders")]);window.products=p;plist.innerHTML=p.map(x=>`<div class="item"><b>${esc(x.name)}</b> · ₹${x.price} · Stock ${x.stock}<br><button onclick="edit(${x.id})">Edit</button><button onclick="removeP(${x.id})">Remove</button></div>`).join("")||"No products";olist.innerHTML=o.map(x=>`<div class="item"><b>Order #${x.id}</b> · ${esc(x.customer_name)} · ₹${x.total}<br>${esc(x.phone)} · ${esc(x.address)}<br>${(x.items||[]).map(i=>esc(i.name)+" × "+i.qty).join(", ")}<br>Status: ${esc(x.status)}<select id="st${x.id}">${["New","Confirmed","Packed","Shipped","Delivered","Cancelled"].map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`)}</select><button onclick="setStatus(${x.id})">Update</button></div>`).join("")||"No orders yet"}
async function edit(id){let p=products.find(x=>x.id===id),n=prompt("Product name",p.name);if(n===null)return;let price=prompt("Price",p.price);if(price===null)return;let stock=prompt("Stock",p.stock);if(stock===null)return;await api("/api/admin/products/"+id,{method:"PUT",body:JSON.stringify({...p,name:n,price,stock})});refresh()}
async function removeP(id){if(confirm("Remove product?")){await api("/api/admin/products/"+id,{method:"DELETE"});refresh()}}
async function setStatus(id){await api("/api/admin/orders/"+id,{method:"PATCH",body:JSON.stringify({status:$("st"+id).value})});alert("Updated")}
async function logout(){await api("/api/admin/logout",{method:"POST"});location.reload()}boot();
</script></html>
